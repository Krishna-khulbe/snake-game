<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>

  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="game">

  
    <header class="stats">
      <div class="stat-box stat-side">High Score : <span id="high-score">00</span></div>
      <div class="stat-box stat-middle">Score : <span id="score">0</span></div>
      <div class="stat-box stat-side">time : <span id="time">00-00</span></div>
    </header>

  <section class="board" id="board">

      <div class="cell food"  style="grid-column: 9;  grid-row: 6;"></div>

      <div class="cell snake" style="grid-column: 17; grid-row: 8;"></div>
      <div class="cell snake" style="grid-column: 18; grid-row: 8;"></div>
      <div class="cell snake" style="grid-column: 19; grid-row: 8;"></div>
      <div class="cell snake" style="grid-column: 20; grid-row: 8;"></div>
      <div class="cell snake" style="grid-column: 21; grid-row: 8;"></div>
      <div class="cell snake" style="grid-column: 22; grid-row: 8;"></div>

    </section>
  </main>
  <div class="modal hidden" id="modal">
    <div class="modal-content">
      <h2 id="modal-title">Snake</h2>
      <p id="modal-text">Use the arrow keys to move</p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
